[subsystem]
name = "model_artifact"
crate = "themql-artifact"
purpose = "Validated transfer of trained models from desktop to embedded"

[artifact]
versioned = true
hash_required = true
schema_required = true

[metadata]
model_id = true
training_version = true
dataset_version = true
feature_schema = true
normalization = true
validation_metrics = true
pruning_metadata = true

[compatibility]
runtime_version = true
architecture_version = true
tensor_schema = true

[deployment]
desktop_export = true
embedded_import = true
validation_before_activation = true

[rollback]
previous_model_retained = true
failed_activation_reverts = true

[api]
public_traits = [
    "ArtifactValidator",
    "ArtifactLoader",
    "ArtifactWriter"
]

[api.ArtifactValidator]
description = "Validates an artifact's integrity, schema, and compatibility before activation"
methods = [
    "fn validate(&self, artifact: &ModelArtifact) -> Result<ValidationReport, ArtifactError>",
    "fn check_compatibility(&self, artifact: &ModelArtifact, target: &RuntimeInfo) -> Result<(), ArtifactError>"
]

[api.ArtifactLoader]
description = "Loads a validated artifact into the embedded inference runtime"
methods = [
    "fn load(&self, path: &Path) -> Result<ModelArtifact, ArtifactError>",
    "fn activate(&self, artifact: &ModelArtifact) -> Result<ActivationHandle, ArtifactError>"
]

[api.ArtifactWriter]
description = "Writes a trained model to an artifact on the desktop side"
methods = [
    "fn write(&self, model: &TrainedModel, metadata: &ArtifactMetadata) -> Result<ModelArtifact, ArtifactError>"
]

# ---------------------------------------------------------------------------
# Concrete types — referenced in trait signatures above, defined here.
# TrainedModel is defined canonically in specs/training.toml; ModelArtifact,
# ArtifactMetadata, ValidationReport, RuntimeInfo, ActivationHandle are
# defined here.
# ---------------------------------------------------------------------------

[api.ModelArtifact]
description = """
The serialised, hash-stamped, schema-tagged artifact that crosses the
desktop→embedded boundary. Holds the model bytes, the hash, the
metadata, and the compatibility info.
"""
rust_type = """
struct ModelArtifact {
    pub model_bytes: Vec<u8>,
    pub format: ModelFormat,         # re-export from themql-schema
    pub hash: [u8; 32],              # SHA-256 of model_bytes
    pub metadata: ArtifactMetadata,
    pub compatibility: CompatibilityInfo,
    pub schema_version: u16,
}
"""
serde = "bincode for transfer; JSON for inspection"

[api.ArtifactMetadata]
rust_type = """
struct ArtifactMetadata {
    pub model_id: String,
    pub training_version: String,
    pub dataset_version: String,
    pub feature_schema: FeatureSchema,    # re-export from themql-schema
    pub normalization: NormalizationSpec, # re-export from themql-schema
    pub validation_metrics: ValidationMetrics,
    pub pruning_metadata: Option<PruningMetadata>,
}
"""
[api.PruningMetadata]
rust_type = """
struct PruningMetadata {
    pub strategy: String,
    pub target_sparsity: f32,
    pub achieved_sparsity: f32,
}
"""

[api.CompatibilityInfo]
rust_type = """
struct CompatibilityInfo {
    pub runtime_version: String,        # themql-inference version that produced this artifact
    pub architecture_version: String,   # model architecture tag (e.g. 'pinn-v1')
    pub tensor_schema: TensorSchema,
}
"""
[api.TensorSchema]
rust_type = """
struct TensorSchema {
    pub input_shapes: Vec<Vec<usize>>,
    pub output_shapes: Vec<Vec<usize>>,
    pub dtype: String,  # 'f32' or 'f64'
}
"""

[api.ValidationReport]
rust_type = """
struct ValidationReport {
    pub hash_ok: bool,
    pub schema_ok: bool,
    pub compatibility_ok: bool,
    pub integrity_ok: bool,
    pub errors: Vec<ArtifactError>,
}
"""

[api.RuntimeInfo]
rust_type = """
struct RuntimeInfo {
    pub runtime_version: String,
    pub architecture_version: String,
    pub supported_formats: Vec<ModelFormat>,
}
"""

[api.ActivationHandle]
rust_type = """
struct ActivationHandle {
    pub model_id: String,
    pub activated_at: Timestamp,
}
"""

[validation_pipeline]
steps = [
    "hash_verify",
    "schema_validate",
    "compatibility_check",
    "integrity_check"
]
order_required = true
short_circuit_on_failure = true

[validation_pipeline.hash_verify]
description = "SHA-256 hash of artifact bytes matches metadata.hash"

[validation_pipeline.schema_validate]
description = "Feature schema, normalization, and tensor schema match declared metadata"

[validation_pipeline.compatibility_check]
description = "Runtime version, architecture version, and tensor schema compatible with target"

[validation_pipeline.integrity_check]
description = "Weights, biases, and structure intact; no truncation or corruption"

[error_model]
variants = [
    "HashMismatch",
    "SchemaMismatch",
    "IncompatibleRuntime",
    "IncompatibleArchitecture",
    "CorruptedArtifact",
    "MissingMetadata",
    "ValidationFailed",
    "ActivationFailed",
    "RollbackFailed"
]
propagation = "Result<T, ArtifactError>"
no_silent_activation = true
no_bypass = true

[lifecycle]
desktop_export = "themql-training writes artifact via ArtifactWriter"
transfer = "artifact file transferred to embedded target (mechanism out of scope)"
embedded_import = "themql-inference loads via ArtifactLoader"
validation = "ArtifactValidator runs full validation_pipeline before activation"
activation = "validated artifact activated; previous model retained"
rollback = "on activation failure, previous model restored automatically"

[threading]
send_required = true
sync_optional = true
validation_sync = true
activation_atomic = true
rollback_atomic = true

[constraints]
arbitrary_model_activation = false
schema_bypass = false
validation_bypass = false
activation_without_previous_retained = false
training_code_in_artifact = false
inference_code_in_artifact = false