# .cargo/config.toml — build toolchain configuration
#
# This config is written to activate mold + sccache when available, but
# does NOT break builds when they are absent.
#
# To enable mold (fast linker):
#   1. Install: apt install mold  (or: cargo install mold)
#   2. Uncomment the [target.x86_64-unknown-linux-gnu] block below.
#
# To enable sccache (compilation cache):
#   1. Install: cargo install sccache
#   2. Uncomment `rustc-wrapper = "sccache"` in [build] below.
#   3. Or set RUSTC_WRAPPER=sccache in your shell.

# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = [
#     "-C", "link-arg=-fuse-ld=mold",
# ]

# [build]
# rustc-wrapper = "sccache"

[alias]
# Shortcuts for common verification commands (see AGENTS.md for the full set).
chk = "check --workspace"
tst = "test --workspace"
fmtc = "fmt --check"
clip = "clippy --workspace --all-targets"