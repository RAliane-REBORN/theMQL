[package]
name = "themql-estimation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "themql_estimation"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["dep:themql-core", "thiserror/std"]

[dependencies]
themql-core = { workspace = true, optional = true }
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
themql-core.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "ekf_step"
harness = false