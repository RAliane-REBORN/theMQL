[package]
name = "themql-training"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "themql_training"
path = "src/lib.rs"

[features]
tch-backend = ["dep:tch"]

[dependencies]
themql-core.workspace = true
themql-artifact.workspace = true
themql-schema.workspace = true
themql-analysis.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
polars.workspace = true
tch = { workspace = true, optional = true, features = ["download-libtorch"] }