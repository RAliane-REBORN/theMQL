[package]
name = "themql-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "themql-desktop"
path = "src/main.rs"

[dependencies]
themql-core.workspace = true
themql-graphql.workspace = true
themql-sse.workspace = true
themql-analysis.workspace = true
themql-artifact.workspace = true
themql-storage.workspace = true
themql-schema.workspace = true
themql-training = { workspace = true, optional = true }
themql-mqtt.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "signal"] }
ratatui = { workspace = true }
axum.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[features]
tch-backend = ["dep:themql-training", "themql-training/tch-backend"]